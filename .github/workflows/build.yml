name: Build Turbo Intruder

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Java JDK 11 (required for compilation)
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. Grant execute permission to the Gradle wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Compile the source and generate the fat JAR
    - name: Build Fat JAR with Gradle
      run: ./gradlew build jar

    # 5. Upload the compiled JAR as a reusable GitHub artifact
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: turbo-intruder-jar
        path: build/libs/*all.jar

